<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>敘事元素機</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes popIn {
      0% { transform: scale(0.1); opacity: 0; }
      60% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes floatLeft {
      0% { transform: translateX(-100px) translateY(0px); }
      50% { transform: translateX(50vw) translateY(-10px); }
      100% { transform: translateX(100vw) translateY(0px); }
    }
    @keyframes floatRight {
      0% { transform: translateX(100vw) translateY(0px); }
      50% { transform: translateX(50vw) translateY(15px); }
      100% { transform: translateX(-100px) translateY(0px); }
    }
    @keyframes rainFall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(115vh) rotate(360deg); opacity: 0; }
    }
    .pop-animation {
      animation: popIn 0.28s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    .animate-float-left {
      animation: floatLeft 45s linear infinite;
    }
    .animate-float-right {
      animation: floatRight 60s linear infinite;
    }
    .emoji-rain-item {
      position: absolute;
      top: -10vh;
      animation: rainFall linear infinite;
      pointer-events: none;
      z-index: 40;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-300 via-blue-200 to-indigo-100 text-slate-800 font-sans relative overflow-x-hidden flex flex-col">

        <path d="M 20,30 C 15,30 10,25 10,20 C 10,14 16,10 22,12 C 25,7 32,5 38,8 C 43,4 51,5 55,10 C 60,6 68,8 70,14 C 76,14 80,18 80,24 C 80,29 75,34 68,34" />
      </svg>
    </div>
    <div class="absolute top-[45%] right-[-10%] opacity-35 animate-float-right">
      <svg class="w-40 sm:w-56 text-white fill-current" viewBox="0 0 100 40">

    <div class="absolute bottom-[10%] left-[-15%] opacity-50 animate-float-left">
      <svg class="w-28 sm:w-40 text-white fill-current" viewBox="0 0 100 40">

            <path stroke-linecap="round" stroke-linejoin="round" d="M9.5 2A2.5 2.5 0 0112 4.5v15a2.5 2.5 0 01-4.96-.44M14.5 2A2.5 2.5 0 0012 4.5v15a2.5 2.5 0 004.96-.44" />
          </svg>
        </div>
        <h1 class="text-lg sm:text-2xl font-black text-indigo-950 tracking-tight">
          Narrative Builder <span class="hidden sm:inline font-bold text-indigo-500 text-lg">| 敘事小幫手</span>

      </div>

      <div class="flex items-center space-x-2 sm:space-x-4">

        <!-- View Controls (Interactive Game state only) -->
        <div id="game-controls" class="flex items-center space-x-2 sm:space-x-4 hidden">

      <!-- Core elements section container -->

        <div id="core-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
      </div>

      <!-- Additional elements section container -->
      <div id="additional-selection-container" class="bg-white/80 backdrop-blur-md rounded-3xl p-5 shadow-md border border-sky-100">
        <div id="additional-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3"></div>
      </div>

      <!-- Action Button -->
      <div class="flex justify-center pt-6 pb-12">
        <button id="start-story-btn" class="flex items-center px-8 py-4 rounded-full text-xl font-bold shadow-xl transition-all duration-300 bg-indigo-600 hover:bg-indigo-500 hover:-translate-y-1 text-white shadow-indigo-300">

    <div id="game-view" class="w-full hidden">
      <div id="boxes-grid" class="grid gap-4 sm:gap-6 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
        <!-- Dynmically loaded game cards -->
      </div>
    </div>

  </main>

  <!-- CELEBRATION MODAL OVERLAY -->

    <div class="bg-white rounded-[2rem] shadow-2xl p-8 max-w-md w-full text-center relative overflow-hidden border-8 border-indigo-400/50 z-50">

      </div>

      <p class="text-slate-600 font-bold mb-6 text-sm sm:text-base leading-relaxed">
        你成功完成了精彩的故事！<br />
        給自己鼓鼓掌吧！👏👏👏
      </p>

      <div class="flex flex-col space-y-2">
        <button id="modal-back-btn" class="w-full py-3 bg-emerald-500 hover:bg-emerald-400 text-white font-extrabold rounded-full transition-colors shadow-md text-base">

          重設元素

      </div>
    </div>
  </div>

      // Additional Elements
      { id: 'thought', label: '想法', enLabel: 'Thought', type: 'additional', color: 'bg-fuchsia-100/90 border-fuchsia-400 text-fuchsia-800', svgPath: `<svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9.813 15.904L9 21l5.096-.813a2 2 0 001.317-.685l7.525-7.525a2.121 2.121 0 10-3-3l-7.525 7.525a2 2 0 00-.685 1.317zM4.5 18H15M4.5 13.5H12m-7.5-9h15"/></svg>` },
      { id: 'dialogue', label: '對話', enLabel: 'Dialogue', type: 'additional', color: 'bg-sky-100/90 border-sky-400 text-sky-800', svgPath: `<svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>` },
      { id: 'connective', label: '連接詞', enLabel: 'Connectives', type: 'additional', color: 'bg-stone-100/90 border-stone-400 text-stone-800', svgPath: `<svg class="w-5 h-5 sm:w-6 sm:h-6" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>` }
    ];

    // --- APP STATE ---
    let selectedElements = ['time', 'place', 'character', 'problem'];
    let boxContents = {}; // maps boxId -> Array of emojis
    let isSoundEnabled = true;

    // Initialize Box Contents arrays
    ELEMENTS_CONFIG.forEach(elem => {
      boxContents[elem.id] = [];
    });

    // --- AUDIO GENERATOR ---
    let audioCtx = null;

    const initAudio = () => {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
          audioCtx = new AudioContext();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    };

    const playPopSound = (pitchMultiplier = 1) => {
      if (!isSoundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.type = 'sine';
        
        const startFreq = 550 * pitchMultiplier;
        const endFreq = 160 * pitchMultiplier;
        
        osc.frequency.setValueAtTime(startFreq, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + 0.08);
        
        gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
        
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.08);
      } catch (e) {
        console.error("Audio playback error", e);
      }
    };

    const playCelebrationSound = () => {
      if (!isSoundEnabled) return;
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const playTone = (freq, startTime, duration) => {
          const osc = audioCtx.createOscillator();
          const gainNode = audioCtx.createGain();
          
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, startTime);
          
          gainNode.gain.setValueAtTime(0.15, startTime);
          gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
          
          osc.connect(gainNode);
          gainNode.connect(audioCtx.destination);
          
          osc.start(startTime);
          osc.stop(startTime + duration);
        };

        playTone(523.25, now, 0.45);        // C5
        playTone(659.25, now + 0.1, 0.45);  // E5
        playTone(783.99, now + 0.2, 0.45);  // G5
        playTone(1046.50, now + 0.3, 0.7);  // C6
        playTone(1318.51, now + 0.45, 0.8); // E6
      } catch (e) {
        console.error("Celebration audio error", e);
      }
    };

    // --- UI HELPERS ---

    // Generates the Image fallback system cleanly in JS DOM construction
    const renderIconHTML = (id, fallbackSvg) => {
      return `
        <div class="relative w-5 h-5 sm:w-6 sm:h-6 flex items-center justify-center">
          <img 
            src="icons/${id}.png" 
            alt="${id}" 
            class="absolute inset-0 w-full h-full object-contain" 
            onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"
          />
          <div style="display: none;" class="w-full h-full text-current">
            ${fallbackSvg}
          </div>
        </div>
      `;
    };

    // --- VIEW MANAGEMENT ---

    const showView = (viewName) => {
      const menuView = document.getElementById('menu-view');
      const gameView = document.getElementById('game-view');
      const gameControls = document.getElementById('game-controls');

      if (viewName === 'menu') {
        menuView.classList.remove('hidden');
        gameView.classList.add('hidden');
        gameControls.classList.add('hidden');
      } else {
        menuView.classList.add('hidden');
        gameView.classList.remove('hidden');
        gameControls.classList.remove('hidden');
        renderGameLayout();
      }
    };

    // --- MENU INTERFACE GENERATION ---

    const renderMenuSelection = () => {
      const coreGrid = document.getElementById('core-grid');
      const additionalGrid = document.getElementById('additional-grid');
      
      coreGrid.innerHTML = '';
      additionalGrid.innerHTML = '';

      ELEMENTS_CONFIG.forEach(config => {
        const isSelected = selectedElements.includes(config.id);
        const button = document.createElement('button');
        button.className = `flex items-center p-3.5 rounded-2xl border-2 transition-all duration-200 text-left ${
          isSelected 
            ? `${config.color.split(' ')[0]} ${config.color.split(' ')[1]} shadow-sm scale-[1.01]` 
            : 'bg-sky-50/50 border-sky-100/60 text-sky-900 hover:bg-sky-100/50'
        }`;

        button.innerHTML = `
          <div class="flex items-center justify-center w-6 h-6 rounded-md mr-3 ${isSelected ? 'bg-white shadow-sm' : 'bg-sky-100/50'}">
            ${isSelected ? `<svg class="w-4 h-4 ${config.color.split(' ')[2]}" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>` : ''}
          </div>
          <div class="flex items-center space-x-2 overflow-hidden select-none">
            ${renderIconHTML(config.id, config.svgPath)}
            <span class="font-bold text-sm whitespace-nowrap">${config.label}</span>
          </div>
        `;

        button.addEventListener('click', () => {
          if (selectedElements.includes(config.id)) {
            selectedElements = selectedElements.filter(e => e !== config.id);
          } else {
            selectedElements.push(config.id);
          }
          renderMenuSelection();
          updateStartButtonState();
        });

        if (config.type === 'core') {
          coreGrid.appendChild(button);
        } else {
          additionalGrid.appendChild(button);
        }
      });
    };

    const updateStartButtonState = () => {
      const startBtn = document.getElementById('start-story-btn');
      if (selectedElements.length > 0) {
        startBtn.disabled = false;
        startBtn.className = 'flex items-center px-8 py-4 rounded-full text-xl font-bold shadow-xl transition-all duration-300 bg-indigo-600 hover:bg-indigo-500 hover:-translate-y-1 text-white shadow-indigo-300';
      } else {
        startBtn.disabled = true;
        startBtn.className = 'flex items-center px-8 py-4 rounded-full text-xl font-bold shadow-xl transition-all duration-300 bg-slate-300/80 text-slate-500 cursor-not-allowed';
      }
    };

    // --- GAME INTERFACE GENERATION ---

    const renderGameLayout = () => {
      const grid = document.getElementById('boxes-grid');
      grid.innerHTML = '';

      // Clean Responsive Column Layout
      grid.className = 'grid gap-4 sm:gap-6 grid-cols-1 sm:grid-cols-2';
      if (selectedElements.length >= 3) {
        grid.className += ' lg:grid-cols-3';
      }
      if (selectedElements.length >= 8) {
        grid.className += ' xl:grid-cols-4';
      }

      ELEMENTS_CONFIG.filter(e => selectedElements.includes(e.id)).forEach(config => {
        const card = document.createElement('div');
        card.id = `box-card-${config.id}`;
        card.className = `relative flex flex-col rounded-2xl border-4 ${config.color} shadow-lg overflow-hidden min-h-[170px] sm:min-h-[210px] select-none touch-manipulation transition-all hover:shadow-xl active:scale-[0.98]`;

        // Render card structure
        card.innerHTML = `
          <!-- Header Bar -->
          <div class="flex items-center justify-between px-3 py-2 border-b-4 ${config.color.split(' ')[1]} bg-white/70 backdrop-blur-sm z-10">
            <div class="flex items-center space-x-2">
              ${renderIconHTML(config.id, config.svgPath)}
              <span class="font-bold text-sm sm:text-base md:text-lg tracking-wide">
                ${config.label} <span class="opacity-60 text-xs hidden sm:inline ml-1">${config.enLabel}</span>
              </span>
            </div>
            <div class="flex items-center">
              <button id="clear-btn-${config.id}" class="p-1 hover:bg-black/10 rounded-full transition-colors text-slate-700 hidden" title="清除盒子">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Body Grid (2x5 Grid for perfectly aligned emojis) -->
          <div id="grid-body-${config.id}" class="flex-1 relative grid grid-cols-5 grid-rows-2 p-3 gap-2 bg-white/50 hover:bg-white/75 transition-colors cursor-pointer">
            <div id="placeholder-${config.id}" class="absolute inset-0 flex items-center justify-center opacity-40 pointer-events-none z-10">
              <p class="font-semibold text-sm tracking-wider text-slate-600">Tap to play 🌟</p>
            </div>
            <!-- Slots -->
            ${Array.from({ length: 10 }).map((_, index) => `
              <div id="slot-${config.id}-${index}" class="flex items-center justify-center relative w-full h-full"></div>
            `).join('')}
          </div>
        `;

        grid.appendChild(card);

        // Bind Clear functionality
        const clearBtn = card.querySelector(`#clear-btn-${config.id}`);
        clearBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          boxContents[config.id] = [];
          updateBoxDisplay(config.id);
        });

        // Bind Tap to Drop functionality
        const body = card.querySelector(`#grid-body-${config.id}`);
        body.addEventListener('click', () => {
          const currentEmojis = boxContents[config.id];
          if (currentEmojis.length >= 10) return;

          playPopSound(1 + (currentEmojis.length * 0.06));

          const emojiPool = EMOJI_DATA[config.dataKey || config.id] || ['❓'];
          const randomEmoji = emojiPool[Math.floor(Math.random() * emojiPool.length)];
          
          currentEmojis.push(randomEmoji);
          updateBoxDisplay(config.id);
        });

        // Initialize state view for current card values
        updateBoxDisplay(config.id);
      });
    };

    const updateBoxDisplay = (boxId) => {
      const contents = boxContents[boxId];
      const placeholder = document.getElementById(`placeholder-${boxId}`);
      const clearBtn = document.getElementById(`clear-btn-${boxId}`);

      // Placeholder view state
      if (contents.length > 0) {
        placeholder.style.display = 'none';
        clearBtn.classList.remove('hidden');
      } else {
        placeholder.style.display = 'flex';
        clearBtn.classList.add('hidden');
      }

      // Populate grid slots
      for (let i = 0; i < 10; i++) {
        const slot = document.getElementById(`slot-${boxId}-${i}`);
        slot.innerHTML = '';
        if (contents[i]) {
          const span = document.createElement('span');
          span.className = 'text-3xl sm:text-4xl md:text-5xl drop-shadow-md pop-animation select-none pointer-events-none';
          span.style.lineHeight = '1';
          span.innerText = contents[i];
          slot.appendChild(span);
        }
      }
    };

    // --- CELEBRATION CONFLICTS / EFFECT SYSTEMS ---

    const spawnEmojiRain = () => {
      const container = document.getElementById('rain-container');
      container.innerHTML = '';
      const pool = ['🎉', '🌟', '✨', '🎂', '🏆', '🎈'];

      for (let i = 0; i < 40; i++) {
        const item = document.createElement('div');
        const randomEmoji = pool[Math.floor(Math.random() * pool.length)];
        const leftOffset = Math.random() * 95;
        const delay = Math.random() * 4;
        const duration = 3 + Math.random() * 3;
        const fontSize = 1.5 + Math.random() * 2;

        item.className = 'emoji-rain-item';
        item.style.left = `${leftOffset}%`;
        item.style.animationDelay = `${delay}s`;
        item.style.animationDuration = `${duration}s`;
        item.style.fontSize = `${fontSize}rem`;
        item.innerText = randomEmoji;

        container.appendChild(item);
      }
    };

    // --- APP EVENT REGISTRATION ---

    document.getElementById('start-story-btn').addEventListener('click', () => {
      showView('game');
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      showView('menu');
    });

    document.getElementById('finish-btn').addEventListener('click', () => {
      playCelebrationSound();
      spawnEmojiRain();
      document.getElementById('celebration-modal').classList.remove('hidden');
    });

    // Modal Actions
    document.getElementById('modal-back-btn').addEventListener('click', () => {
      document.getElementById('celebration-modal').classList.add('hidden');
    });

    document.getElementById('modal-reset-btn').addEventListener('click', () => {
      document.getElementById('celebration-modal').classList.add('hidden');
      // Reset all boards when resetting
      ELEMENTS_CONFIG.forEach(elem => {
        boxContents[elem.id] = [];
      });
      showView('menu');
    });

    // Sound toggle handlers
    document.getElementById('sound-btn').addEventListener('click', () => {
      isSoundEnabled = !isSoundEnabled;
      const onIcon = document.getElementById('sound-on-icon');
      const offIcon = document.getElementById('sound-off-icon');
      if (isSoundEnabled) {
        onIcon.classList.remove('hidden');
        offIcon.classList.add('hidden');
      } else {
        onIcon.classList.add('hidden');
        offIcon.classList.remove('hidden');
      }
    });

    // Initialize Menu Screen View on load
    window.onload = () => {
      renderMenuSelection();
      updateStartButtonState();
      showView('menu');
    };
  </script>
</body>
</html>
