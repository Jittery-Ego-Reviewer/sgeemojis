<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>敘事元素機</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* VFX: Pop and Rotate Animation */
    @keyframes pop-rotate {
      0% { transform: scale(0.5) rotate(0deg); opacity: 0; }
      50% { transform: scale(1.3) rotate(calc(var(--rot) * 2)); opacity: 1; }
      100% { transform: scale(1) rotate(var(--rot)); opacity: 1; }
    }
    .animate-pop-rotate {
      animation: pop-rotate 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* VFX: Pulsing Highlight */
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
      50% { box-shadow: 0 0 25px rgba(255, 183, 3, 0.9), inset 0 0 10px rgba(255, 183, 3, 0.3); }
    }
    .highlight-glow {
      animation: pulse-glow 2s infinite !important;
      border-color: #ffb703 !important;
    }

    /* VFX: Tactile Buttons */
    .tactile-btn {
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tactile-btn:active {
      transform: translateY(6px) !important;
      box-shadow: 0 0 0 transparent !important;
    }

    /* Background Cloud Animations */
    @keyframes floatLeft {
      0% { transform: translateX(-100px) translateY(0px); }
      50% { transform: translateX(50vw) translateY(-10px); }
      100% { transform: translateX(100vw) translateY(0px); }
    }
    @keyframes floatRight {
      0% { transform: translateX(100vw) translateY(0px); }
      50% { transform: translateX(50vw) translateY(15px); }
      100% { transform: translateX(-100px) translateY(0px); }
    }
    @keyframes rainFall {
      0% { transform: translateY(-100px) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(115vh) rotate(360deg); opacity: 0; }
    }
    .animate-float-left { animation: floatLeft 45s linear infinite; }
    .animate-float-right { animation: floatRight 60s linear infinite; }
    .emoji-rain-item {
      position: absolute;
      top: -10vh;
      animation: rainFall linear infinite;
      pointer-events: none;
      z-index: 40;
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-b from-sky-300 via-blue-200 to-indigo-100 text-slate-800 font-sans relative overflow-x-hidden flex flex-col">

  <script>
    // --- DATABASE CONFIGURATION ---

      internalresponse: ['😲', '😨', '🤔', '🤩', '😠', '🥺', '😱', '😡', '🤯', '😂', '😜', '🤪', '😏', '😅', '🤤', '😴', '😩', '🙄', '😮‍💨', '😭'],

      attempt: ['🏃', '🏊', '🧗', '🚣', '🕵️', '🤺', '🛠️', '🗣️', '🦸', '🚶', '🚴', '🏇', '🏌️', '🏂', '🏄', '🧘', '🧍', '🧎', '🕺', '💃', '💭', '🧭', '📖', '🔍', '🗺️', '📚', '🗒️', '🧾', '🗓️', '🧑‍🏫', '🧑‍💻', '⛱️', '📱', '📷', '🔋', '🧯', '🔦', '🕯️', '💵', '🔨', '🧹', '🧼', '🧻', '🗝️', '🛒', '🪞', '🗑️', '🖊️', '✂️', '📢', '🏳️', '🏃🏻‍♀️', '🏃🏻'],
      consequence: ['🎉', '🏆', '💀', '🩹', '🤝', '💖', '🥇', '🧧', '🥈', '🥉', '🏅', '🪙', '🔓'],
      feelings: ['😭', '🥰', '🥳', '😲', '😨', '🤔', '🤩', '😠', '🥺', '😱', '😡', '🤯', '😂', '😜', '🤪', '😏', '😅', '🤤', '😴', '😩', '🙄', '😮‍💨'],
      reflection: ['💭', '🤔'],
      thought: ['💭', '🧠'],
      dialogue: ['💬', '🗨️', '🗯️'],
      connective: ['🔗', '➡️', '➕']
    };
    
    EMOJI_DATA.setting = [...EMOJI_DATA.time, ...EMOJI_DATA.place, ...EMOJI_DATA.character];

    const ELEMENTS_CONFIG = [
      { id: 'time', label: '時間', enLabel: 'Time', type: 'core', maxItems: 5, color: 'bg-amber-100/90 border-amber-400 text-amber-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>` },
      { id: 'character', label: '人物', enLabel: 'Character', type: 'core', maxItems: 5, color: 'bg-blue-100/90 border-blue-400 text-blue-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>` },
      { id: 'place', label: '地點', enLabel: 'Place', type: 'core', maxItems: 5, color: 'bg-emerald-100/90 border-emerald-400 text-emerald-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>` },
      { id: 'setting', label: '背景', enLabel: 'Setting', type: 'core', maxItems: 10, color: 'bg-teal-100/90 border-teal-400 text-teal-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>` },
      { id: 'problem', label: '起因', enLabel: 'Problem', type: 'core', maxItems: 10, dataKey: 'cause', color: 'bg-red-100/90 border-red-400 text-red-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>` },

      { id: 'plan', label: '計劃', enLabel: 'Plan', type: 'core', maxItems: 10, color: 'bg-cyan-100/90 border-cyan-400 text-cyan-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/><path d="M9 14h6M9 18h6M10 10h4"/></svg>` },
      { id: 'attempt', label: '行動', enLabel: 'Attempt', type: 'core', maxItems: 10, color: 'bg-orange-100/90 border-orange-400 text-orange-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>` },
      { id: 'consequence', label: '結果', enLabel: 'Consequence', type: 'core', maxItems: 10, color: 'bg-rose-100/90 border-rose-400 text-rose-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1zM4 22v-7"/></svg>` },
      { id: 'feelings', label: '感受', enLabel: 'Feelings', type: 'core', maxItems: 10, color: 'bg-pink-100/90 border-pink-400 text-pink-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>` },
      { id: 'reflection', label: '反思/道理', enLabel: 'Reflection', type: 'core', maxItems: 10, color: 'bg-violet-100/90 border-violet-400 text-violet-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2zM22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/></svg>` },
      { id: 'thought', label: '想法', enLabel: 'Thought', type: 'additional', maxItems: 10, color: 'bg-fuchsia-100/90 border-fuchsia-400 text-fuchsia-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9.813 15.904L9 21l5.096-.813a2 2 0 001.317-.685l7.525-7.525a2.121 2.121 0 10-3-3l-7.525 7.525a2 2 0 00-.685 1.317zM4.5 18H15M4.5 13.5H12m-7.5-9h15"/></svg>` },
      { id: 'dialogue', label: '對話', enLabel: 'Dialogue', type: 'additional', maxItems: 10, color: 'bg-sky-100/90 border-sky-400 text-sky-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>` },
      { id: 'connective', label: '連接詞', enLabel: 'Connectives', type: 'additional', maxItems: 10, color: 'bg-stone-100/90 border-stone-400 text-stone-800', svgPath: `<svg class="w-full h-full" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>` }
    ];

    // --- APP STATE ---
    let selectedElements = ['time', 'character', 'place'];
    let boxContents = {}; // maps boxId -> Array of objects { emoji, rot }

    ELEMENTS_CONFIG.forEach(elem => {
      boxContents[elem.id] = [];
    });

    // --- AUDIO SYSTEM (From Analysis) ---
    let audioCtx = null;

    const initAudio = () => {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    };

    function playTone(freq, type, duration, vol = 0.1) {
      initAudio();
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(0, audioCtx.currentTime);
        gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) { console.error(e); }
    }

    // 1. Click Sound (800Hz sine wave)
    function playClickSound() { playTone(800, 'sine', 0.1, 0.05); }
    // 2. Spinning Ticks (1200Hz triangle)
    function playSpinTick() { playTone(1200, 'triangle', 0.05, 0.02); }
    // 3. Success Chime (C5, E5, G5)
    function playSuccessSound() {
      playTone(523.25, 'sine', 0.15, 0.1); 
      setTimeout(() => playTone(659.25, 'sine', 0.15, 0.1), 100); 
      setTimeout(() => playTone(783.99, 'sine', 0.3, 0.1), 200); 
    }
    // 4. Victory Fanfare (7-note scale)
    function playWinSound() {
      [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        setTimeout(() => playTone(freq, i%2===0 ? 'square':'triangle', 0.4, 0.1), i * 100);
      });
    }

    // --- UI HELPERS ---
    const renderIconHTML = (id, fallbackSvg) => {
      return `
        <div class="relative w-10 h-10 sm:w-12 sm:h-12 flex-shrink-0 flex items-center justify-center">
          <img src="icons/${id}.png" alt="${id}" class="absolute inset-0 w-full h-full object-contain" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" />
          <div style="display: none;" class="w-full h-full text-current">${fallbackSvg}</div>
        </div>
      `;
    };

    // --- VIEW MANAGEMENT ---
    const showView = (viewName) => {
      const menuView = document.getElementById('menu-view');
      const gameView = document.getElementById('game-view');
      const gameControls = document.getElementById('game-controls');

      if (viewName === 'menu') {
        menuView.classList.remove('hidden');
        gameView.classList.add('hidden');
        gameControls.classList.add('hidden');
      } else {
        menuView.classList.add('hidden');
        gameView.classList.remove('hidden');
        gameControls.classList.remove('hidden');
        renderGameLayout();
      }
    };

    // --- MENU INTERFACE GENERATION ---
    const renderMenuSelection = () => {
      const coreGrid = document.getElementById('core-grid');
      const additionalGrid = document.getElementById('additional-grid');
      
      coreGrid.innerHTML = '';
      additionalGrid.innerHTML = '';

      ELEMENTS_CONFIG.forEach(config => {
        const isSelected = selectedElements.includes(config.id);
        const button = document.createElement('button');
        
        button.className = `tactile-btn flex items-center p-3.5 rounded-2xl border-2 text-left ${
          isSelected 
            ? `${config.color.split(' ')[0]} ${config.color.split(' ')[1]} shadow-md scale-[1.02]` 
            : 'bg-sky-50/50 border-sky-100/60 text-sky-900 hover:bg-sky-100/50'
        }`;

        button.innerHTML = `
          <div class="flex items-center justify-center w-6 h-6 sm:w-8 sm:h-8 rounded-md mr-3 sm:mr-4 flex-shrink-0 ${isSelected ? 'bg-white shadow-sm' : 'bg-sky-100/50'}">
            ${isSelected ? `<svg class="w-4 h-4 sm:w-5 sm:h-5 ${config.color.split(' ')[2]}" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>` : ''}
          </div>
          <div class="flex items-center space-x-3 overflow-hidden select-none">
            ${renderIconHTML(config.id, config.svgPath)}
            <span class="font-bold text-lg whitespace-nowrap">${config.label}</span>
          </div>
        `;

        button.addEventListener('click', () => {
          playClickSound(); // Added SFX
          if (selectedElements.includes(config.id)) {
            selectedElements = selectedElements.filter(e => e !== config.id);
          } else {
            selectedElements.push(config.id);
          }
          renderMenuSelection();
          updateStartButtonState();
        });

        if (config.type === 'core') {
          coreGrid.appendChild(button);
        } else {
          additionalGrid.appendChild(button);
        }
      });
    };

    const updateStartButtonState = () => {
      const startBtn = document.getElementById('start-story-btn');
      if (selectedElements.length > 0) {
        startBtn.disabled = false;
        startBtn.className = 'tactile-btn flex items-center px-8 py-4 rounded-full text-xl font-bold shadow-xl transition-all duration-300 bg-indigo-600 hover:bg-indigo-500 text-white shadow-indigo-300';
      } else {
        startBtn.disabled = true;
        startBtn.className = 'flex items-center px-8 py-4 rounded-full text-xl font-bold shadow-xl transition-all duration-300 bg-slate-300/80 text-slate-500 cursor-not-allowed';
      }
    };

    // --- GAME INTERFACE GENERATION ---
    const renderGameLayout = () => {
      const grid = document.getElementById('boxes-grid');
      grid.innerHTML = '';

      grid.className = 'grid gap-4 sm:gap-6 grid-cols-1 sm:grid-cols-2';
      if (selectedElements.length >= 3) grid.className += ' lg:grid-cols-3';
      if (selectedElements.length >= 8) grid.className += ' xl:grid-cols-4';

      ELEMENTS_CONFIG.filter(e => selectedElements.includes(e.id)).forEach(config => {
        const card = document.createElement('div');
        card.id = `box-card-${config.id}`;
        card.className = `tactile-btn relative flex flex-col rounded-2xl border-4 ${config.color} shadow-lg overflow-hidden min-h-[170px] sm:min-h-[210px] select-none touch-manipulation transition-all hover:shadow-xl active:translate-y-2 active:shadow-none`;
        card.dataset.isSpinning = "false"; // State for slot mechanic

        const rowClass = config.maxItems === 5 ? 'grid-rows-1' : 'grid-rows-2';

        card.innerHTML = `
          <div class="flex items-center justify-between px-3 py-2 border-b-4 ${config.color.split(' ')[1]} bg-white/70 backdrop-blur-sm z-10">
            <div class="flex items-center space-x-2 sm:space-x-3">
              ${renderIconHTML(config.id, config.svgPath)}
              <span class="font-bold text-base sm:text-lg md:text-xl tracking-wide">
                ${config.label} <span class="opacity-60 text-sm hidden sm:inline ml-1">${config.enLabel}</span>
              </span>
            </div>
            <div class="flex items-center">
              <button id="clear-btn-${config.id}" class="tactile-btn p-1.5 hover:bg-black/10 rounded-full text-slate-700 hidden" title="清除盒子">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" />
                </svg>
              </button>
            </div>
          </div>

          <div id="grid-body-${config.id}" class="flex-1 relative grid grid-cols-5 ${rowClass} p-3 gap-2 bg-white/50 hover:bg-white/75 transition-colors cursor-pointer">
            ${Array.from({ length: config.maxItems }).map((_, index) => `
              <div id="slot-${config.id}-${index}" class="flex items-center justify-center relative w-full h-full min-h-[50px] overflow-visible"></div>
            `).join('')}
          </div>
        `;

        grid.appendChild(card);

        // Bind Clear functionality
        const clearBtn = card.querySelector(`#clear-btn-${config.id}`);
        clearBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          playClickSound(); // Added SFX
          boxContents[config.id] = [];
          updateBoxDisplay(config.id);
        });

        // VFX & SFX: Spin and Motion Blur Mechanics
        const body = card.querySelector(`#grid-body-${config.id}`);
        body.addEventListener('click', () => {
          if (card.dataset.isSpinning === "true") return; // Prevent double click
          const currentEmojis = boxContents[config.id];
          if (currentEmojis.length >= config.maxItems) {
            playClickSound(); // Just a basic tap if full
            return;
          }

          card.dataset.isSpinning = "true";
          const slotIndex = currentEmojis.length;
          const slotEl = document.getElementById(`slot-${config.id}-${slotIndex}`);
          
          // Setup spin visual
          slotEl.innerHTML = `<span class="text-4xl sm:text-5xl md:text-6xl drop-shadow-md inline-block">❓</span>`;
          const spanEl = slotEl.querySelector('span');

          const emojiPool = EMOJI_DATA[config.dataKey || config.id] || ['❓'];
          let ticks = 0;
          const maxTicks = 15; // Speed of slot machine spin

          const spinInterval = setInterval(() => {
            const randomEmoji = emojiPool[Math.floor(Math.random() * emojiPool.length)];
            spanEl.innerText = randomEmoji;
            // Motion Blur Effect
            spanEl.style.transform = `translateY(${Math.random() * 12 - 6}px)`;
            
            if (ticks % 2 === 0) playSpinTick(); // SFX: Spin Ticks
            ticks++;

            if (ticks >= maxTicks) {
              clearInterval(spinInterval);
              
              // Select Final and define randomized rotation (VFX feature)
              const finalEmoji = emojiPool[Math.floor(Math.random() * emojiPool.length)];
              const finalRot = (Math.random() * 30 - 15).toFixed(2); // Random -15deg to 15deg
              
              currentEmojis.push({ emoji: finalEmoji, rot: finalRot });
              
              playSuccessSound(); // SFX: Success Chime
              card.dataset.isSpinning = "false";
              updateBoxDisplay(config.id, slotIndex); // Re-render with animations
            }
          }, 80);
        });

        // Initialize display
        updateBoxDisplay(config.id);
      });
    };

    const updateBoxDisplay = (boxId, animateIndex = -1) => {
      const contents = boxContents[boxId];
      const clearBtn = document.getElementById(`clear-btn-${boxId}`);
      const config = ELEMENTS_CONFIG.find(c => c.id === boxId);
      const card = document.getElementById(`box-card-${boxId}`);

      if (contents.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }

      // VFX: Visual Scaffolding & Prompts (Pulsing glowing border when not complete)
      if (contents.length < config.maxItems) {
        card.classList.add('highlight-glow');
      } else {
        card.classList.remove('highlight-glow');
      }

      // Populate grid
      for (let i = 0; i < config.maxItems; i++) {
        const slot = document.getElementById(`slot-${boxId}-${i}`);
        
        // Skip modifying inner HTML of slots currently spinning
        if (card.dataset.isSpinning === "true" && i === contents.length) continue;

        slot.innerHTML = '';
        if (contents[i]) {
          const span = document.createElement('span');
          // VFX: Apply the pop-rotate class if it was just spawned
          span.className = `text-4xl sm:text-5xl md:text-6xl drop-shadow-md inline-block select-none pointer-events-none ${i === animateIndex ? 'animate-pop-rotate' : ''}`;
          span.style.setProperty('--rot', `${contents[i].rot}deg`);
          
          if (i !== animateIndex) {
            span.style.transform = `rotate(${contents[i].rot}deg)`;
          }
          span.innerText = contents[i].emoji;
          slot.appendChild(span);
        }
      }
    };

    // --- CELEBRATION CONFLICTS / EFFECT SYSTEMS ---

    const spawnEmojiRain = () => {
      const container = document.getElementById('rain-container');
      container.innerHTML = '';
      const pool = ['🎉', '🌟', '✨', '🎂', '🏆', '🎈'];
      for (let i = 0; i < 40; i++) {
        const item = document.createElement('div');
        item.className = 'emoji-rain-item';
        item.style.left = `${Math.random() * 95}%`;
        item.style.animationDelay = `${Math.random() * 4}s`;
        item.style.animationDuration = `${3 + Math.random() * 3}s`;
        item.style.fontSize = `${1.5 + Math.random() * 2}rem`;
        item.innerText = pool[Math.floor(Math.random() * pool.length)];
        container.appendChild(item);
      }
    };

    // VFX: Confetti Canvas implementation from Analysis
    const confettiCanvas = document.getElementById('confetti-canvas');
    const ctx = confettiCanvas.getContext('2d');
    let confettiParticles = [];
    let confettiAnimationId;

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function startConfetti() {
      confettiCanvas.classList.remove('hidden');
      confettiParticles = [];
      const colors = ['#ff0a54', '#ff477e', '#ff7096', '#ff85a1', '#fbb1bd', '#f9bec7', '#ff99c8', '#fcf6bd', '#d0f4de', '#a9def9', '#e4c1f9'];
      for (let i = 0; i < 150; i++) {
        confettiParticles.push({
          x: confettiCanvas.width / 2,
          y: confettiCanvas.height / 2 + 100,
          r: Math.random() * 6 + 4,
          dx: Math.random() * 20 - 10,
          dy: Math.random() * -20 - 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          tilt: Math.floor(Math.random() * 10) - 10,
          tiltAngleInc: (Math.random() * 0.07) + 0.05,
          tiltAngle: 0
        });
      }
      animateConfetti();
    }

    function animateConfetti() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      let active = false;
      confettiParticles.forEach(p => {
        p.tiltAngle += p.tiltAngleInc;
        p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
        p.x += Math.sin(p.tiltAngle) * 2;
        p.dy += 0.2; // gravity
        p.x += p.dx;
        p.y += p.dy;

        ctx.beginPath();
        ctx.lineWidth = p.r;
        ctx.strokeStyle = p.color;
        ctx.moveTo(p.x + p.tilt + p.r, p.y);
        ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
        ctx.stroke();

        if (p.y < confettiCanvas.height) active = true;
      });

      if (active) confettiAnimationId = requestAnimationFrame(animateConfetti);
    }

    function stopConfetti() {
      cancelAnimationFrame(confettiAnimationId);
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiCanvas.classList.add('hidden');
    }

    // --- APP EVENT REGISTRATION ---

    document.getElementById('start-story-btn').addEventListener('click', () => {
      playClickSound();
      showView('game');
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      playClickSound();
      showView('menu');
    });

    document.getElementById('finish-btn').addEventListener('click', () => {
      playWinSound(); // SFX: Victory Fanfare
      spawnEmojiRain();
      startConfetti(); // VFX: Massive visual reward
      document.getElementById('celebration-modal').classList.remove('hidden');
    });

    // Modal Actions
    document.getElementById('modal-back-btn').addEventListener('click', () => {
      playClickSound();
      stopConfetti();
      document.getElementById('celebration-modal').classList.add('hidden');
    });

    document.getElementById('modal-reset-btn').addEventListener('click', () => {
      playClickSound();
      stopConfetti();
      document.getElementById('celebration-modal').classList.add('hidden');
      // Reset all boards
      ELEMENTS_CONFIG.forEach(elem => boxContents[elem.id] = []);
      showView('menu');
    });

    // Initialize
    window.onload = () => {
      renderMenuSelection();
      updateStartButtonState();
      showView('menu');
    };
  </script>
</body>
</html>
